<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="card-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#040711" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="glass-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ff006e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="neon-cyan-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>

    <linearGradient id="neon-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="progress-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap');
      .txt-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .txt-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar-line {
        transform-origin: 390px 205px;
        animation: radar-sweep 8s linear infinite;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .pulse-beacon {
        animation: pulse-dot 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="580" height="420" rx="22" fill="url(#card-body)" stroke="url(#glass-edge)" stroke-width="2"/>

  <!-- Background grid -->
  <g opacity="0.04" stroke="#00f3ff" stroke-width="1">
    <line x1="35" y1="0" x2="35" y2="420"/>
    <line x1="330" y1="0" x2="330" y2="420"/>
    <line x1="0" y1="52" x2="580" y2="52"/>
    <line x1="0" y1="365" x2="580" y2="365"/>
  </g>

  <!-- Header beacon -->
  <g transform="translate(35, 34)">
    <circle class="pulse-beacon" cx="0" cy="0" r="5" fill="#00ff9d" filter="url(#emerald-glow)"/>
  </g>

  <!-- ============ LEFT COLUMN ROWS ============ -->

  <!-- Row 1 -->
  <g transform="translate(35, 72)">
    <text class="txt-sans" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8" y="0">PROFESSIONAL EXPERIENCE</text>
    <text class="txt-mono" font-size="22" font-weight="800" fill="#ffffff" y="28">4+ Years</text>
    <text class="txt-sans" font-size="10.5" font-weight="600" fill="#00f3ff" x="130" y="26">Full Stack / Web3</text>
    <rect y="42" width="265" height="4" rx="2" fill="#0f172a"/>
    <rect y="42" width="245" height="4" rx="2" fill="url(#progress-bar-grad)"/>
    <line x1="0" y1="58" x2="275" y2="58" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Row 2 -->
  <g transform="translate(35, 148)">
    <text class="txt-sans" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8" y="0">STACK ARCHITECTURE &amp; DEPLOYMENT</text>
    <text class="txt-mono" font-size="18" font-weight="800" fill="#00f3ff" y="27">Web3 Platforms</text>
    <text class="txt-sans" font-size="8.5" font-weight="600" letter-spacing="0.4" fill="#94a3b8" x="178" y="26">Next.js + NestJS</text>
    <rect y="42" width="265" height="4" rx="2" fill="#0f172a"/>
    <rect y="42" width="255" height="4" rx="2" fill="url(#progress-bar-grad)"/>
    <line x1="0" y1="58" x2="275" y2="58" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Row 3 -->
  <g transform="translate(35, 224)">
    <text class="txt-sans" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8" y="0">SYSTEM PERFORMANCE</text>
    <text class="txt-mono" font-size="20" font-weight="800" fill="#00ff9d" y="27">High Performance</text>
    <text class="txt-sans" font-size="9.5" font-weight="600" fill="#94a3b8" y="42">APIs + Queues + WebSockets</text>
    <rect y="52" width="265" height="4" rx="2" fill="#0f172a"/>
    <rect y="52" width="262" height="4" rx="2" fill="url(#neon-emerald)"/>
  </g>

  <!-- Row 4 -->
  <g transform="translate(35, 306)">
    <text class="txt-sans" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8" y="0">CLOUD &amp; DELIVERY</text>
    <text class="txt-mono" font-size="20" font-weight="800" fill="#38bdf8" y="27">Cloud Ready</text>
    <text class="txt-sans" font-size="10.5" font-weight="600" fill="#64748b" y="42">AWS + Docker + CI/CD</text>
    <rect y="52" width="265" height="4" rx="2" fill="#0f172a"/>
    <rect y="52" width="250" height="4" rx="2" fill="url(#progress-bar-grad)"/>
  </g>

  <!-- Vertical divider -->
  <line x1="330" y1="70" x2="330" y2="350" stroke="url(#glass-edge)" stroke-width="1.5"/>

  <!-- ============ RIGHT SIDE: RADAR HUD ============ -->
  <g transform="translate(390, 205)">
    <circle r="60" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle r="30" fill="none" stroke="#0f172a" stroke-width="1"/>

    <line x1="-66" y1="0" x2="66" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="0" y1="-66" x2="0" y2="66" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3"/>

    <line class="radar-line" x1="0" y1="0" x2="48" y2="0" stroke="#00f3ff" stroke-width="2" opacity="0.6"/>

    <circle r="48" fill="none" stroke="url(#neon-cyan-green)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="300" stroke-dashoffset="45" transform="rotate(-90)"/>

    <text class="txt-sans" font-size="36" font-weight="900" fill="#ffffff" x="0" y="12" text-anchor="middle" letter-spacing="0.5">S+</text>

    <text class="txt-mono" font-size="11" font-weight="800" fill="#00ff9d" x="0" y="80" text-anchor="middle" letter-spacing="2">WEB3 ENGINEER</text>
    <text class="txt-mono" font-size="9" font-weight="600" fill="#64748b" x="0" y="96" text-anchor="middle" letter-spacing="1">SOLIDITY // AI // CLOUD</text>
  </g>

  <!-- ============ FOOTER TELEMETRY ============ -->
  <g transform="translate(35, 388)" class="txt-mono" font-size="8.5" font-weight="700">
    <text fill="#64748b">CORE: <tspan fill="#00f3ff">NODE.JS</tspan></text>
    <text x="130" fill="#64748b">CHAIN: <tspan fill="#00ff9d">SOLIDITY</tspan></text>
    <text x="270" fill="#64748b">AI: <tspan fill="#f8fafc">RAG / AGENTS</tspan></text>
    <text x="420" fill="#64748b">CLOUD: <tspan fill="#00ff9d">AWS</tspan></text>
  </g>
</svg>